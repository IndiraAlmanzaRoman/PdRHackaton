name: Update lockfile

# Regenerates pulsemarket/package-lock.json after package.json changes.
# Run manually from the Actions tab (select the branch first).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsemarket
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update package-lock.json"
          git push
