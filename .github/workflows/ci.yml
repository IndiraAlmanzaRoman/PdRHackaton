name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsemarket
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pulsemarket?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pulsemarket/package-lock.json

      - name: Install dependencies
        run: |
          if ! npm ci > "$RUNNER_TEMP/npm-ci.log" 2>&1; then
            echo "::error title=npm ci failed::$(tail -n 30 "$RUNNER_TEMP/npm-ci.log" | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
